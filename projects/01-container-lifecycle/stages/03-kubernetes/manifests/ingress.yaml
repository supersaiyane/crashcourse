# Ingress: cutlink-ingress
#
# An Ingress is a Kubernetes resource that manages external HTTP/HTTPS
# access to Services inside the cluster. It provides:
#   - Host-based routing (cutlink.local -> frontend service)
#   - TLS termination (HTTPS -> HTTP)
#   - URL path rewriting
#
# Unlike Services (which work at Layer 4 — TCP/UDP), an Ingress works
# at Layer 7 (HTTP/HTTPS). This means it can inspect HTTP headers,
# cookies, and paths to make routing decisions.
#
# IMPORTANT: An Ingress resource does nothing by itself. You need
# an Ingress Controller (a Pod running nginx, HAProxy, Traefik, etc.)
# installed in the cluster. For kind, we install NGINX Ingress Controller
# separately (see Exercise 3).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cutlink-ingress
  namespace: cutlink
  annotations:
    # The NGINX Ingress Controller uses this annotation to generate
    # a self-signed TLS certificate. For kind/local development, this
    # avoids needing a real cert — the browser will warn you, but HTTPS works.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Rewrite target: strips the /api prefix when proxying to backend.
    # Actually, for Cutlink, the frontend nginx handles /api/ proxying,
    # so we just route everything to the frontend Service.
    nginx.ingress.kubernetes.io/rewrite-target: /
    # Increase the body size limit for URL submissions (default 1MB is fine).
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  # ingressClassName tells the cluster which Ingress Controller to use.
  # With kind's NGINX Ingress Controller, this is "nginx".
  ingressClassName: nginx
  # TLS configuration: terminate HTTPS at the Ingress.
  # The secret "cutlink-tls" will be auto-generated by the NGINX
  # Ingress Controller when using the annotation above.
  # Without a real CA, the browser will show a security warning.
  # You can either click through it or add the cert to your trust store.
  tls:
    - hosts:
        - cutlink.local
      secretName: cutlink-tls
  rules:
    # Traffic for host "cutlink.local" is routed according to these rules.
    # You must add this to your /etc/hosts file:
    #   127.0.0.1 cutlink.local
    - host: cutlink.local
      http:
        paths:
          # All traffic (/) goes to the frontend Service on port 80.
          # The frontend nginx then handles /api/ -> backend proxying.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
