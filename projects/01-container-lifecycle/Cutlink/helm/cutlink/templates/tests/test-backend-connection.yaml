apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "cutlink.fullname" . }}-test-connection"
  namespace: {{ include "cutlink.namespace" . }}
  labels:
    {{- include "cutlink.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: curl-backend
      image: curlimages/curl:latest
      command:
        - sh
        - -c
        - |
          echo "Testing backend health endpoint..."
          curl -sS --fail -o /dev/null -w "HTTP %{http_code}\n" \
            http://{{ include "cutlink.fullname" . }}-backend:{{ .Values.backend.service.port }}/health
  restartPolicy: Never
