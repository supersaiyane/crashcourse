apiVersion: v1
kind: Service
metadata:
  name: {{ include "cutlink.fullname" . }}-frontend
  namespace: {{ include "cutlink.namespace" . }}
  labels:
    {{- include "cutlink.labels" . | nindent 4 }}
    component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cutlink.selectorLabels" . | nindent 4 }}
    component: frontend
