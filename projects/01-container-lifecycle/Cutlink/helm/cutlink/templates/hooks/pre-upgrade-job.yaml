{{- if .Values.hooks.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "cutlink.fullname" . }}-db-migrate"
  namespace: {{ include "cutlink.namespace" . }}
  labels:
    {{- include "cutlink.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: db-migrate
          image: "{{ .Values.hooks.dbMigrate.image.repository }}:{{ .Values.hooks.dbMigrate.image.tag }}"
          command:
            - psql
            - -h
            - {{ include "cutlink.db.host" . }}
            - -U
            - {{ .Values.backend.env.DB_USER }}
            - -d
            - {{ .Values.backend.env.DB_NAME }}
            - -c
            - "SELECT 1; -- Migration placeholder: add ALTER TABLE statements here"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.secrets.existingSecret }}
                  name: {{ .Values.secrets.existingSecret }}
                  {{- else }}
                  name: {{ include "cutlink.fullname" . }}-backend
                  {{- end }}
                  key: DB_PASS
{{- end }}
