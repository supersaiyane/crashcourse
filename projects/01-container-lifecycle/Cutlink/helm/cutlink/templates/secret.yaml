apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cutlink.fullname" . }}-backend
  namespace: {{ include "cutlink.namespace" . }}
  labels:
    {{- include "cutlink.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.existingSecret }}
  DB_PASS: ""
  {{- else }}
  DB_PASS: {{ .Values.secrets.db_pass | b64enc | quote }}
  {{- end }}
