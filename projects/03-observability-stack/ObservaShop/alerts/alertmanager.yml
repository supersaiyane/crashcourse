global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    - match:
        severity: critical
      receiver: "pagerduty"
      continue: true
    - match:
        severity: warning
      receiver: "slack"

receivers:
  - name: "default"
    webhook_configs:
      - url: "http://localhost:9095/webhook"  # placeholder
  - name: "pagerduty"
    webhook_configs:
      - url: "http://localhost:9095/pagerduty"  # placeholder
  - name: "slack"
    webhook_configs:
      - url: "http://localhost:9095/slack"  # placeholder

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "service"]
