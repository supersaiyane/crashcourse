global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: "order-svc"
    static_configs:
      - targets: ["order-svc:8081"]

  - job_name: "payment-svc"
    static_configs:
      - targets: ["payment-svc:8082"]

  - job_name: "inventory-svc"
    static_configs:
      - targets: ["inventory-svc:8083"]
