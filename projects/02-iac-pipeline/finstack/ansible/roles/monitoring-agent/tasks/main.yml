# -----------------------------------------------------------------------------
# monitoring-agent role — tasks/main.yml
#
# Installs Prometheus node_exporter as a systemd service.
# Variables:
#   exporter_version  — version to install (default: 1.7.0)
#   exporter_port     — listen port (default: 9100)
# -----------------------------------------------------------------------------
---
- name: Create node_exporter system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /bin/false
    create_home: false

- name: Download node_exporter {{ exporter_version }}
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ exporter_version }}/node_exporter-{{ exporter_version }}.linux-amd64.tar.gz"
    dest: "/tmp/node_exporter-{{ exporter_version }}.tar.gz"
    mode: "0644"

- name: Extract node_exporter binary
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ exporter_version }}.tar.gz"
    dest: /tmp
    remote_src: true

- name: Install node_exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    owner: node_exporter
    group: node_exporter
    mode: "0755"
    remote_src: true
  notify: restart node_exporter

- name: Deploy node_exporter systemd unit
  ansible.builtin.template:
    src: node-exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: restart node_exporter

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started

- name: Clean up downloaded archive
  ansible.builtin.file:
    path: "/tmp/node_exporter-{{ exporter_version }}.tar.gz"
    state: absent

- name: Clean up extracted directory
  ansible.builtin.file:
    path: "/tmp/node_exporter-{{ exporter_version }}.linux-amd64"
    state: absent
