# -----------------------------------------------------------------------------
# Ansible Configuration — FinStack
#
# Project-level ansible.cfg. Ansible automatically picks this up when you
# run ansible-playbook from the finstack/ansible/ directory.
# -----------------------------------------------------------------------------

[defaults]
# Inventory file — sample hosts grouped by role
inventory = inventory/hosts.ini

# Roles path — where Ansible looks for roles
roles_path = roles

# SSH settings — key-based auth, no host key checking for lab/dev
remote_user = ec2-user
private_key_file = ~/.ssh/finstack.pem
host_key_checking = False

# Performance — run tasks on multiple hosts in parallel
forks = 10

# Reduce noise in output
stdout_callback = yaml
deprecation_warnings = False
retry_files_enabled = False

# Fact caching — speed up repeated runs
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout = 3600

[privilege_escalation]
# Most tasks need root — default to sudo
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# Speed up SSH by reusing connections
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
