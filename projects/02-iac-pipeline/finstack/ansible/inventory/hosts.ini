# -----------------------------------------------------------------------------
# Ansible Inventory — FinStack (Sample)
#
# Groups match the FinStack architecture: web (EKS worker nodes / API hosts),
# db (RDS jump hosts or self-managed DB), monitoring (Prometheus/Grafana).
#
# Replace these sample IPs with your actual EC2 private IPs after
# terraform apply. For LocalStack testing, use localhost with connection=local.
# -----------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Web tier — payment API hosts / EKS worker nodes
# ---------------------------------------------------------------------------
[web]
web-1 ansible_host=10.0.1.10
web-2 ansible_host=10.0.1.11
web-3 ansible_host=10.0.1.12

# ---------------------------------------------------------------------------
# Database tier — RDS bastion / self-managed PostgreSQL hosts
# ---------------------------------------------------------------------------
[db]
db-1  ansible_host=10.0.2.20
db-2  ansible_host=10.0.2.21

# ---------------------------------------------------------------------------
# Monitoring tier — Prometheus, Grafana, Alertmanager hosts
# ---------------------------------------------------------------------------
[monitoring]
mon-1 ansible_host=10.0.3.30

# ---------------------------------------------------------------------------
# Group variables — applied to all hosts in a group
# ---------------------------------------------------------------------------
[web:vars]
node_exporter_port=9100
app_name=finstack-payment-api

[db:vars]
node_exporter_port=9100
postgres_port=5432

[monitoring:vars]
node_exporter_port=9100
prometheus_port=9090
grafana_port=3000

# ---------------------------------------------------------------------------
# All FinStack hosts — common variables
# ---------------------------------------------------------------------------
[finstack:children]
web
db
monitoring

[finstack:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=~/.ssh/finstack.pem
environment=dev
aws_region=ap-south-1
ntp_server=169.254.169.123
