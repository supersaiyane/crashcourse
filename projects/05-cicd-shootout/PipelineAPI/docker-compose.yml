version: "3.9"

services:
  frontend:
    build: ./frontend
    ports: ["8000:80"]
    depends_on: [api]

  api:
    build: ./api
    ports: ["5050:5000"]
    environment:
      FLASK_ENV: development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
