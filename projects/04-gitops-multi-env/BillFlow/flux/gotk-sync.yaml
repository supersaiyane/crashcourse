apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: billflow
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/supersaiyane/crashcourse
  ref:
    branch: main
  secretRef:
    name: flux-git-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: billflow-dev
  namespace: flux-system
spec:
  interval: 5m
  path: ./projects/04-gitops-multi-env/BillFlow/k8s/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: billflow
  targetNamespace: billflow-dev
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: billflow-staging
  namespace: flux-system
spec:
  interval: 5m
  path: ./projects/04-gitops-multi-env/BillFlow/k8s/overlays/staging
  prune: true
  sourceRef:
    kind: GitRepository
    name: billflow
  targetNamespace: billflow-staging
  dependsOn:
    - name: billflow-dev
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: billflow-production
  namespace: flux-system
spec:
  interval: 10m
  path: ./projects/04-gitops-multi-env/BillFlow/k8s/overlays/production
  prune: true
  sourceRef:
    kind: GitRepository
    name: billflow
  targetNamespace: billflow-production
  dependsOn:
    - name: billflow-staging
