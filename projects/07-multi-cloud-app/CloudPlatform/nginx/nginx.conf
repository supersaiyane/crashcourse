# ---------------------------------------------------------------------------
# Production nginx configuration for CloudPlatform
#
# - Reverse proxy for the analytics API (port 5000)
# - Static file serving for the frontend
# - Gzip compression, security headers, rate limiting
# ---------------------------------------------------------------------------

# Run as a single worker (adjust for production based on CPU cores)
worker_processes auto;

events {
    worker_connections 1024;    # max simultaneous connections per worker
}

http {
    # ------------------------------------------------------------------
    # Basic settings
    # ------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;              # efficient file transfer
    tcp_nopush  on;              # optimise packet sending
    tcp_nodelay on;              # reduce latency for small packets

    keepalive_timeout 65;        # keep connections alive for 65 s

    # ------------------------------------------------------------------
    # Logging — include request time for latency analysis
    # ------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ------------------------------------------------------------------
    # Gzip compression — reduces bandwidth for JSON and static assets
    # ------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;        # add Vary: Accept-Encoding header
    gzip_proxied      any;       # compress proxied responses too
    gzip_comp_level   6;         # balanced compression (1=fast, 9=max)
    gzip_min_length   256;       # skip tiny responses
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ------------------------------------------------------------------
    # Rate limiting — 10 requests/second per client IP
    #
    # Protects the API from abuse and accidental load spikes.
    # The burst=20 allows short bursts before throttling kicks in.
    # ------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # ------------------------------------------------------------------
    # Upstream — analytics API backend on port 5000
    # ------------------------------------------------------------------
    upstream api_backend {
        server api:5000;         # the Flask analytics service (Docker network)

        # Add more servers here for load balancing:
        # server 127.0.0.1:5001;
        # server 127.0.0.1:5002;
    }

    # ------------------------------------------------------------------
    # Server block
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name _;           # catch-all — replace with your domain in production

        # Root for frontend static files
        root /usr/share/nginx/html;
        index index.html;

        # --------------------------------------------------------------
        # Security headers
        # --------------------------------------------------------------
        add_header X-Frame-Options        "SAMEORIGIN"       always;  # prevent clickjacking
        add_header X-Content-Type-Options "nosniff"          always;  # prevent MIME sniffing
        add_header X-XSS-Protection       "1; mode=block"    always;  # legacy XSS filter
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

        # Hide nginx version from response headers
        server_tokens off;

        # --------------------------------------------------------------
        # API proxy — /api/ routes go to the backend
        # --------------------------------------------------------------
        location /api/ {
            # Apply rate limiting (burst allows 20 queued requests)
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://api_backend;
            proxy_http_version 1.1;

            # Pass real client info to the backend
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (if needed)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts — adjust for slow analytics queries
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    60s;

            # Buffer settings for large JSON responses
            proxy_buffering       on;
            proxy_buffer_size     16k;
            proxy_buffers         4 32k;
            proxy_busy_buffers_size 64k;
        }

        # --------------------------------------------------------------
        # Frontend — serve static files, fall back to index.html for SPA
        # --------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;  # SPA fallback routing
        }

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires    30d;
            add_header Cache-Control "public, immutable";
            access_log off;          # skip logging for static assets
        }

        # --------------------------------------------------------------
        # Health check endpoint — useful for load balancers and k8s probes
        # --------------------------------------------------------------
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # Block access to hidden files (e.g. .env, .git)
        location ~ /\. {
            deny  all;
            access_log off;
            log_not_found off;
        }
    }
}
